<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鱼丸</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #0a0a0c; /* 改成了高级深黑背景，这样粒子才看得清 */
    background: radial-gradient(circle at center, #1a1a24 0%, #000000 100%);
  }
  #particle-canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    cursor: pointer;
  }
</style>
</head>
<body>

<canvas id="particle-canvas"></canvas>

<script>
(function () {
  const canvas = document.getElementById('particle-canvas');
  const ctx = canvas.getContext('2d');

  let W = 0, H = 0, DPR = 1;
  let t = 0;

  let particles = [];
  let mode = 'heart';

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    buildTargets();
  }

  function heartPoint(angle) {
    const x = 16 * Math.pow(Math.sin(angle), 3);
    const y = 13 * Math.cos(angle) - 5 * Math.cos(2 * angle)
            - 2 * Math.cos(3 * angle) - Math.cos(4 * angle);
    return { x: x, y: -y };
  }

  function buildHeart3D(count, cx, cy, scale) {
    const outline = [];
    const steps = 720;
    for (let i = 0; i < steps; i++) {
      const a = (i / steps) * Math.PI * 2;
      outline.push(heartPoint(a));
    }

    let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
    for (const p of outline) {
      if (p.x < minX) minX = p.x;
      if (p.x > maxX) maxX = p.x;
      if (p.y < minY) minY = p.y;
      if (p.y > maxY) maxY = p.y;
    }

    function inside(px, py) {
      let wn = 0;
      for (let i = 0; i < outline.length; i++) {
        const a = outline[i];
        const b = outline[(i + 1) % outline.length];
        if (a.y <= py) {
          if (b.y > py) {
            const cross = (b.x - a.x) * (py - a.y) - (px - a.x) * (b.y - a.y);
            if (cross > 0) wn++;
          }
        } else {
          if (b.y <= py) {
            const cross = (b.x - a.x) * (py - a.y) - (px - a.x) * (b.y - a.y);
            if (cross < 0) wn--;
          }
        }
      }
      return wn !== 0;
    }

    const pts = [];
    let guard = 0;

    while (pts.length < count && guard < count * 140) {
      guard++;
      const rx = minX + Math.random() * (maxX - minX);
      const ry = minY + Math.random() * (maxY - minY);
      if (!inside(rx, ry)) continue;

      const nx = (rx - (minX + maxX) / 2) / ((maxX - minX) / 2);
      const ny = (ry - (minY + maxY) / 2) / ((maxY - minY) / 2);
      const dist = Math.sqrt(nx * nx + ny * ny);

      const edgeCurve = Math.cos(Math.min(1, dist) * Math.PI * 0.5);
      const bulge = Math.max(0, edgeCurve);
      const z = Math.pow(bulge, 1.75) * 1.55 + Math.random() * 0.20;
      const persp = 1 + z * 0.30;
      const edgeInset = 1 - Math.pow(dist, 2.2) * 0.06;

      pts.push({
        x: cx + rx * scale * persp * edgeInset,
        y: cy + ry * scale * persp * edgeInset,
        z: z
      });
    }

    return pts;
  }

  function buildTextTargets(text, count, cx, cy, fontSize, letterGap) {
    const measureCanvas = document.createElement('canvas');
    const mctx = measureCanvas.getContext('2d');
    const font = `900 ${fontSize}px "Microsoft YaHei", "PingFang SC", "Arial Black", sans-serif`;
    mctx.font = font;

    const letterWidths = [];
    let totalW = 0;
    for (const ch of text) {
      const w = mctx.measureText(ch).width;
      letterWidths.push(w);
      totalW += w;
    }
    totalW += letterGap * (text.length - 1);

    const pad = fontSize * 0.8;
    const offW = Math.ceil(totalW + pad * 2);
    const offH = Math.ceil(fontSize * 1.6);

    const off = document.createElement('canvas');
    off.width = offW;
    off.height = offH;
    const octx = off.getContext('2d');

    octx.fillStyle = '#fff';
    octx.font = font;
    octx.textAlign = 'left';
    octx.textBaseline = 'middle';

    let cursorX = pad;
    for (let i = 0; i < text.length; i++) {
      octx.fillText(text[i], cursorX, offH / 2);
      cursorX += letterWidths[i] + letterGap;
    }

    const img = octx.getImageData(0, 0, offW, offH).data;

    function alphaAt(x, y) {
      if (x < 0 || y < 0 || x >= offW || y >= offH) return 0;
      return img[(y * offW + x) * 4 + 3];
    }

    const edge = [];
    const inner = [];

    for (let y = 0; y < offH; y++) {
      for (let x = 0; x < offW; x++) {
        const a = alphaAt(x, y);
        if (a <= 80) continue;

        const isEdge =
          alphaAt(x - 1, y) <= 80 ||
          alphaAt(x + 1, y) <= 80 ||
          alphaAt(x, y - 1) <= 80 ||
          alphaAt(x, y + 1) <= 80;

        if (isEdge) edge.push({ x, y });
        else inner.push({ x, y });
      }
    }

    const edgeCount = Math.floor(count * 0.80);
    const innerCount = count - edgeCount;

    const pts = [];

    function pick(arr, n) {
      if (arr.length === 0) return;
      for (let i = 0; i < n; i++) {
        const c = arr[Math.floor(Math.random() * arr.length)];
        pts.push({
          x: cx + (c.x - offW / 2),
          y: cy + (c.y - offH / 2),
          z: 0.5
        });
      }
    }

    pick(edge, edgeCount);
    pick(inner, innerCount);

    while (pts.length < count && edge.length > 0) {
      const c = edge[Math.floor(Math.random() * edge.length)];
      pts.push({
        x: cx + (c.x - offW / 2),
        y: cy + (c.y - offH / 2),
        z: 0.5
      });
    }

    return pts;
  }

  let heartTargets = [];
  let textTargets = [];

  function buildTargets() {
    const cx = W / 2;
    const cy = H / 2;

    const heartScale = Math.min(W, H) * 0.024;

    let fontSize = Math.min(W * 0.40, H * 0.50);

    const measureCanvas = document.createElement('canvas');
    const mctx = measureCanvas.getContext('2d');
    mctx.font = `900 ${fontSize}px "Microsoft YaHei", "PingFang SC", "Arial Black", sans-serif`;
    let wordW = 0;
    for (const ch of '鱼丸') wordW += mctx.measureText(ch).width;

    const maxWordW = W * 0.88;
    if (wordW > maxWordW) {
      fontSize = fontSize * (maxWordW / wordW);
    }

    const letterGap = fontSize * 0.25;

    const total = Math.min(18000, Math.floor(W * H / 80));

    heartTargets = buildHeart3D(total, cx, cy, heartScale);
    textTargets = buildTextTargets('鱼丸', total, cx, cy, fontSize, letterGap);

    if (particles.length !== total) {
      particles = [];
      for (let i = 0; i < total; i++) {
        const p = heartTargets[i] || { x: cx, y: cy, z: 0.5 };
        particles.push({
          x: p.x + (Math.random() - 0.5) * 40,
          y: p.y + (Math.random() - 0.5) * 40,
          vx: 0,
          vy: 0,
          tx: p.x,
          ty: p.y,
          tz: p.z || 0.5,
          z: p.z || 0.5,
          size: 0.55 + Math.random() * 0.20,
          alpha: 0.80 + Math.random() * 0.20,
          phase: Math.random() * Math.PI * 2,
          speed: 0.04 + Math.random() * 0.07,
          hue: Math.random()
        });
      }
    } else {
      particles.forEach((p, i) => {
        const h = heartTargets[i];
        p.tx = h.x;
        p.ty = h.y;
        p.tz = h.z;
      });
    }
  }

  function updateTargets() {
    const targets = mode === 'heart' ? heartTargets : textTargets;
    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];
      const tg = targets[i % targets.length];
      p.tx = tg.x;
      p.ty = tg.y;
      p.tz = tg.z || 0.5;
    }
  }

  function particleColor(p) {
    const z = p.z;
    const bright = 0.48 + z * 0.58;

    if (p.hue < 0.35) {
      return `rgba(${Math.round(255 * bright)},${Math.round(216 * bright)},${Math.round(170 * bright)},${p.alpha})`;
    }
    if (p.hue < 0.7) {
      return `rgba(${Math.round(255 * bright)},${Math.round(250 * bright)},${Math.round(240 * bright)},${p.alpha})`;
    }
    return `rgba(${Math.round(235 * bright)},${Math.round(225 * bright)},${Math.round(255 * bright)},${p.alpha})`;
  }

  function loop() {
    ctx.clearRect(0, 0, W, H);

    const breathe = 1 + Math.sin(t * 0.0012) * 0.028;

    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];

      const cx = W / 2;
      const cy = H / 2;
      const tx = cx + (p.tx - cx) * (mode === 'heart' ? breathe : 1);
      const ty = cy + (p.ty - cy) * (mode === 'heart' ? breathe : 1);

      const dx = tx - p.x;
      const dy = ty - p.y;
      p.vx += dx * 0.018;
      p.vy += dy * 0.018;

      p.vx *= 0.85;
      p.vy *= 0.85;

      p.z += (p.tz - p.z) * 0.05;

      p.phase += p.speed;
      const noiseX = Math.sin(p.phase * 1.3) * 0.08;
      const noiseY = Math.cos(p.phase * 0.9) * 0.08;

      p.x += p.vx + noiseX;
      p.y += p.vy + noiseY;

      const flicker = 0.90 + Math.sin(t * 0.004 + p.phase * 3) * 0.10;

      const drawSize = p.size * (0.95 + p.z * 0.10);

      ctx.save();
      ctx.globalCompositeOperation = 'lighter';

      const glowR = drawSize * 2.4;
      const glowAlpha = p.alpha * (0.22 + p.z * 0.18) * flicker;
      if (glowR > 0.7) {
        const glow = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, glowR);
        glow.addColorStop(0, particleColor({ ...p, alpha: glowAlpha }));
        glow.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(p.x, p.y, glowR, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.beginPath();
      ctx.arc(p.x, p.y, drawSize, 0, Math.PI * 2);
      ctx.fillStyle = particleColor({ ...p, alpha: p.alpha * flicker });
      ctx.fill();

      ctx.restore();
    }

    t += 16;
    requestAnimationFrame(loop);
  }

  function onClick() {
    mode = mode === 'heart' ? 'text' : 'heart';
    updateTargets();
  }

  canvas.addEventListener('click', onClick);
  window.addEventListener('resize', resize);

  resize();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
