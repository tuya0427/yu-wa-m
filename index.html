<!DOCTYPE html> <!-- tuya -->
<html lang="zh-CN"> <!-- tuya -->
<head> <!-- tuya -->
<meta charset="UTF-8"> <!-- tuya -->
<meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- tuya -->
<title>鱼丸</title> <!-- tuya -->
<style> <!-- tuya -->
  * { margin: 0; padding: 0; box-sizing: border-box; } /* tuya */
  html, body { /* tuya */
    width: 100%; /* tuya */
    height: 100%; /* tuya */
    overflow: hidden; /* tuya */
    background: transparent; /* tuya */
  } /* tuya */
  #particle-canvas { /* tuya */
    position: fixed; /* tuya */
    inset: 0; /* tuya */
    width: 100%; /* tuya */
    height: 100%; /* tuya */
    display: block; /* tuya */
    cursor: pointer; /* tuya */
  } /* tuya */
</style> <!-- tuya -->
</head> <!-- tuya -->
<body> <!-- tuya -->

<canvas id="particle-canvas"></canvas> <!-- tuya -->

<script> /* tuya */
(function () { // tuya
  const canvas = document.getElementById('particle-canvas'); // tuya
  const ctx = canvas.getContext('2d'); // tuya

  let W = 0, H = 0, DPR = 1; // tuya
  let t = 0; // tuya

  let particles = []; // tuya
  let mode = 'heart'; // tuya

  function resize() { // tuya
    DPR = Math.min(window.devicePixelRatio || 1, 2); // tuya
    W = window.innerWidth; // tuya
    H = window.innerHeight; // tuya
    canvas.width = W * DPR; // tuya
    canvas.height = H * DPR; // tuya
    canvas.style.width = W + 'px'; // tuya
    canvas.style.height = H + 'px'; // tuya
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0); // tuya
    buildTargets(); // tuya
  } // tuya

  function heartPoint(angle) { // tuya
    const x = 16 * Math.pow(Math.sin(angle), 3); // tuya
    const y = 13 * Math.cos(angle) - 5 * Math.cos(2 * angle) // tuya
            - 2 * Math.cos(3 * angle) - Math.cos(4 * angle); // tuya
    return { x: x, y: -y }; // tuya
  } // tuya

  function buildHeart3D(count, cx, cy, scale) { // tuya
    const outline = []; // tuya
    const steps = 720; // tuya
    for (let i = 0; i < steps; i++) { // tuya
      const a = (i / steps) * Math.PI * 2; // tuya
      outline.push(heartPoint(a)); // tuya
    } // tuya

    let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity; // tuya
    for (const p of outline) { // tuya
      if (p.x < minX) minX = p.x; // tuya
      if (p.x > maxX) maxX = p.x; // tuya
      if (p.y < minY) minY = p.y; // tuya
      if (p.y > maxY) maxY = p.y; // tuya
    } // tuya

    function inside(px, py) { // tuya
      let wn = 0; // tuya
      for (let i = 0; i < outline.length; i++) { // tuya
        const a = outline[i]; // tuya
        const b = outline[(i + 1) % outline.length]; // tuya
        if (a.y <= py) { // tuya
          if (b.y > py) { // tuya
            const cross = (b.x - a.x) * (py - a.y) - (px - a.x) * (b.y - a.y); // tuya
            if (cross > 0) wn++; // tuya
          } // tuya
        } else { // tuya
          if (b.y <= py) { // tuya
            const cross = (b.x - a.x) * (py - a.y) - (px - a.x) * (b.y - a.y); // tuya
            if (cross < 0) wn--; // tuya
          } // tuya
        } // tuya
      } // tuya
      return wn !== 0; // tuya
    } // tuya

    const pts = []; // tuya
    let guard = 0; // tuya

    while (pts.length < count && guard < count * 140) { // tuya
      guard++; // tuya
      const rx = minX + Math.random() * (maxX - minX); // tuya
      const ry = minY + Math.random() * (maxY - minY); // tuya
      if (!inside(rx, ry)) continue; // tuya

      const nx = (rx - (minX + maxX) / 2) / ((maxX - minX) / 2); // tuya
      const ny = (ry - (minY + maxY) / 2) / ((maxY - minY) / 2); // tuya
      const dist = Math.sqrt(nx * nx + ny * ny); // tuya

      const edgeCurve = Math.cos(Math.min(1, dist) * Math.PI * 0.5); // tuya
      const bulge = Math.max(0, edgeCurve); // tuya
      const z = Math.pow(bulge, 1.75) * 1.55 + Math.random() * 0.20; // tuya
      const persp = 1 + z * 0.30; // tuya
      const edgeInset = 1 - Math.pow(dist, 2.2) * 0.06; // tuya

      pts.push({ // tuya
        x: cx + rx * scale * persp * edgeInset, // tuya
        y: cy + ry * scale * persp * edgeInset, // tuya
        z: z // tuya
      }); // tuya
    } // tuya

    return pts; // tuya
  } // tuya

  function buildTextTargets(text, count, cx, cy, fontSize, letterGap) { // tuya
    const measureCanvas = document.createElement('canvas'); // tuya
    const mctx = measureCanvas.getContext('2d'); // tuya
    const font = `900 ${fontSize}px "Microsoft YaHei", "PingFang SC", "Arial Black", sans-serif`; // tuya
    mctx.font = font; // tuya

    const letterWidths = []; // tuya
    let totalW = 0; // tuya
    for (const ch of text) { // tuya
      const w = mctx.measureText(ch).width; // tuya
      letterWidths.push(w); // tuya
      totalW += w; // tuya
    } // tuya
    totalW += letterGap * (text.length - 1); // tuya

    const pad = fontSize * 0.8; // tuya
    const offW = Math.ceil(totalW + pad * 2); // tuya
    const offH = Math.ceil(fontSize * 1.6); // tuya

    const off = document.createElement('canvas'); // tuya
    off.width = offW; // tuya
    off.height = offH; // tuya
    const octx = off.getContext('2d'); // tuya

    octx.fillStyle = '#fff'; // tuya
    octx.font = font; // tuya
    octx.textAlign = 'left'; // tuya
    octx.textBaseline = 'middle'; // tuya

    let cursorX = pad; // tuya
    for (let i = 0; i < text.length; i++) { // tuya
      octx.fillText(text[i], cursorX, offH / 2); // tuya
      cursorX += letterWidths[i] + letterGap; // tuya
    } // tuya

    const img = octx.getImageData(0, 0, offW, offH).data; // tuya

    function alphaAt(x, y) { // tuya
      if (x < 0 || y < 0 || x >= offW || y >= offH) return 0; // tuya
      return img[(y * offW + x) * 4 + 3]; // tuya
    } // tuya

    const edge = []; // tuya
    const inner = []; // tuya

    for (let y = 0; y < offH; y++) { // tuya
      for (let x = 0; x < offW; x++) { // tuya
        const a = alphaAt(x, y); // tuya
        if (a <= 80) continue; // tuya

        const isEdge = // tuya
          alphaAt(x - 1, y) <= 80 || // tuya
          alphaAt(x + 1, y) <= 80 || // tuya
          alphaAt(x, y - 1) <= 80 || // tuya
          alphaAt(x, y + 1) <= 80; // tuya

        if (isEdge) edge.push({ x, y }); // tuya
        else inner.push({ x, y }); // tuya
      } // tuya
    } // tuya

    const edgeCount = Math.floor(count * 0.80); // tuya
    const innerCount = count - edgeCount; // tuya

    const pts = []; // tuya

    function pick(arr, n) { // tuya
      if (arr.length === 0) return; // tuya
      for (let i = 0; i < n; i++) { // tuya
        const c = arr[Math.floor(Math.random() * arr.length)]; // tuya
        pts.push({ // tuya
          x: cx + (c.x - offW / 2), // tuya
          y: cy + (c.y - offH / 2), // tuya
          z: 0.5 // tuya
        }); // tuya
      } // tuya
    } // tuya

    pick(edge, edgeCount); // tuya
    pick(inner, innerCount); // tuya

    while (pts.length < count && edge.length > 0) { // tuya
      const c = edge[Math.floor(Math.random() * edge.length)]; // tuya
      pts.push({ // tuya
        x: cx + (c.x - offW / 2), // tuya
        y: cy + (c.y - offH / 2), // tuya
        z: 0.5 // tuya
      }); // tuya
    } // tuya

    return pts; // tuya
  } // tuya

  let heartTargets = []; // tuya
  let textTargets = []; // tuya

  function buildTargets() { // tuya
    const cx = W / 2; // tuya
    const cy = H / 2; // tuya

    const heartScale = Math.min(W, H) * 0.024; // tuya

    let fontSize = Math.min(W * 0.40, H * 0.50); // tuya

    const measureCanvas = document.createElement('canvas'); // tuya
    const mctx = measureCanvas.getContext('2d'); // tuya
    mctx.font = `900 ${fontSize}px "Microsoft YaHei", "PingFang SC", "Arial Black", sans-serif`; // tuya
    let wordW = 0; // tuya
    for (const ch of '鱼丸') wordW += mctx.measureText(ch).width; // tuya

    const maxWordW = W * 0.88; // tuya
    if (wordW > maxWordW) { // tuya
      fontSize = fontSize * (maxWordW / wordW); // tuya
    } // tuya

    const letterGap = fontSize * 0.25; // tuya

    const total = Math.min(18000, Math.floor(W * H / 80)); // tuya

    heartTargets = buildHeart3D(total, cx, cy, heartScale); // tuya
    textTargets = buildTextTargets('鱼丸', total, cx, cy, fontSize, letterGap); // tuya

    if (particles.length !== total) { // tuya
      particles = []; // tuya
      for (let i = 0; i < total; i++) { // tuya
        const p = heartTargets[i] || { x: cx, y: cy, z: 0.5 }; // tuya
        particles.push({ // tuya
          x: p.x + (Math.random() - 0.5) * 40, // tuya
          y: p.y + (Math.random() - 0.5) * 40, // tuya
          vx: 0, // tuya
          vy: 0, // tuya
          tx: p.x, // tuya
          ty: p.y, // tuya
          tz: p.z || 0.5, // tuya
          z: p.z || 0.5, // tuya
          size: 0.55 + Math.random() * 0.20, // tuya
          alpha: 0.80 + Math.random() * 0.20, // tuya
          phase: Math.random() * Math.PI * 2, // tuya
          speed: 0.04 + Math.random() * 0.07, // tuya
          hue: Math.random() // tuya
        }); // tuya
      } // tuya
    } else { // tuya
      particles.forEach((p, i) => { // tuya
        const h = heartTargets[i]; // tuya
        p.tx = h.x; // tuya
        p.ty = h.y; // tuya
        p.tz = h.z; // tuya
      }); // tuya
    } // tuya
  } // tuya

  function updateTargets() { // tuya
    const targets = mode === 'heart' ? heartTargets : textTargets; // tuya
    for (let i = 0; i < particles.length; i++) { // tuya
      const p = particles[i]; // tuya
      const tg = targets[i % targets.length]; // tuya
      p.tx = tg.x; // tuya
      p.ty = tg.y; // tuya
      p.tz = tg.z || 0.5; // tuya
    } // tuya
  } // tuya

  function particleColor(p) { // tuya
    const z = p.z; // tuya
    const bright = 0.48 + z * 0.58; // tuya

    if (p.hue < 0.35) { // tuya
      return `rgba(${Math.round(255 * bright)},${Math.round(216 * bright)},${Math.round(170 * bright)},${p.alpha})`; // tuya
    } // tuya
    if (p.hue < 0.7) { // tuya
      return `rgba(${Math.round(255 * bright)},${Math.round(250 * bright)},${Math.round(240 * bright)},${p.alpha})`; // tuya
    } // tuya
    return `rgba(${Math.round(235 * bright)},${Math.round(225 * bright)},${Math.round(255 * bright)},${p.alpha})`; // tuya
  } // tuya

  function loop() { // tuya
    ctx.clearRect(0, 0, W, H); // tuya

    const breathe = 1 + Math.sin(t * 0.0012) * 0.028; // tuya

    for (let i = 0; i < particles.length; i++) { // tuya
      const p = particles[i]; // tuya

      const cx = W / 2; // tuya
      const cy = H / 2; // tuya
      const tx = cx + (p.tx - cx) * (mode === 'heart' ? breathe : 1); // tuya
      const ty = cy + (p.ty - cy) * (mode === 'heart' ? breathe : 1); // tuya

      const dx = tx - p.x; // tuya
      const dy = ty - p.y; // tuya
      p.vx += dx * 0.018; // tuya
      p.vy += dy * 0.018; // tuya

      p.vx *= 0.85; // tuya
      p.vy *= 0.85; // tuya

      p.z += (p.tz - p.z) * 0.05; // tuya

      p.phase += p.speed; // tuya
      const noiseX = Math.sin(p.phase * 1.3) * 0.08; // tuya
      const noiseY = Math.cos(p.phase * 0.9) * 0.08; // tuya

      p.x += p.vx + noiseX; // tuya
      p.y += p.vy + noiseY; // tuya

      const flicker = 0.90 + Math.sin(t * 0.004 + p.phase * 3) * 0.10; // tuya

      const drawSize = p.size * (0.95 + p.z * 0.10); // tuya

      ctx.save(); // tuya
      ctx.globalCompositeOperation = 'lighter'; // tuya

      const glowR = drawSize * 2.4; // tuya
      const glowAlpha = p.alpha * (0.22 + p.z * 0.18) * flicker; // tuya
      if (glowR > 0.7) { // tuya
        const glow = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, glowR); // tuya
        glow.addColorStop(0, particleColor({ ...p, alpha: glowAlpha })); // tuya
        glow.addColorStop(1, 'rgba(255,255,255,0)'); // tuya
        ctx.fillStyle = glow; // tuya
        ctx.beginPath(); // tuya
        ctx.arc(p.x, p.y, glowR, 0, Math.PI * 2); // tuya
        ctx.fill(); // tuya
      } // tuya

      ctx.beginPath(); // tuya
      ctx.arc(p.x, p.y, drawSize, 0, Math.PI * 2); // tuya
      ctx.fillStyle = particleColor({ ...p, alpha: p.alpha * flicker }); // tuya
      ctx.fill(); // tuya

      ctx.restore(); // tuya
    } // tuya

    t += 16; // tuya
    requestAnimationFrame(loop); // tuya
  } // tuya

  function onClick() { // tuya
    mode = mode === 'heart' ? 'text' : 'heart'; // tuya
    updateTargets(); // tuya
  } // tuya

  canvas.addEventListener('click', onClick); // tuya
  window.addEventListener('resize', resize); // tuya

  resize(); // tuya
  requestAnimationFrame(loop); // tuya
})(); // tuya
</script> <!-- tuya -->
</body> <!-- tuya -->
</html> <!-- tuya -->
